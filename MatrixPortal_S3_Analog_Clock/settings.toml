# WiFi credentials — remove or leave blank for offline manual mode
CIRCUITPY_WIFI_SSID = "your-wifi-ssid"
CIRCUITPY_WIFI_PASSWORD = "your-wifi-password"

# IANA timezone for automatic DST handling
# Full list: http://worldtimeapi.org/timezones
TIMEZONE = "America/New_York"

# Fallback UTC offset if timezone API is unreachable
# (e.g. -5 for EST, -4 for EDT, +1 for CET)
TZ_OFFSET = "-5"
